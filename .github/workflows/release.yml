name: Release

on:
  release:
    types: [created]

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Build for Linux and Mac (Windows CGO SQLite is notoriously tricky)
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    # We need a C compiler for SQLite
    - name: Install gcc
      run: sudo apt-get update && sudo apt-get install gcc -y
      if: matrix.goos == 'linux'

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: go build -ldflags="-s -w" -o quicknote-${{ matrix.goos }}-${{ matrix.goarch }} .

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: quicknote-${{ matrix.goos }}-${{ matrix.goarch }}
