name: Release

on:
  release:
    types: [created]

jobs:
  build:
    name: Build Binaries
    strategy:
      matrix:
        include:
          # Linux (Intel/AMD)
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          # Mac (Intel)
          - os: macos-latest
            goos: darwin
            goarch: amd64
          # Mac (Apple Silicon / M1 / M2 / M3)
          - os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

    - name: Build Binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: go build -ldflags="-s -w" -o quicknote-${{ matrix.goos }}-${{ matrix.goarch }} .

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: quicknote-${{ matrix.goos }}-${{ matrix.goarch }}