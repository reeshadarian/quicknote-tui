name: Go baseline
on:
  push:
    branches: [dev/v2]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      GOFLAGS: "-tags=sqlite_fts5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit and regression tests
        run: go test ./...
      - name: Static checks
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Race tests
        run: go test -race ./...
